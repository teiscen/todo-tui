# Panel dimensions are outer terminal-cell sizes, including borders.
layout:
  tasks:
    width: 50
    height: 43
  preview:
    width: 50
    height: 43
  editor:
    width: 50
    height: 43

# -- Calendar --
# Colors: Weekend, Weekday, Accent
#
# -- Notes --
# Colors: Text, Accent
#
# -- Planner -- 
# Color: Border 
#
# -- Labels -- 
# Selected: LabelID
# Order:    []LabelID
# Info:     map[LabelID]LabelInfo

colors:
  text:    "#C6D0F5"
  border:  "#C6D0F5"
  weekday: "#C6D0F5"
  weekend: "#939AB7"
  
labels:
  selected: personal
  order: [personal, work, errands, health, home]
  info:
    personal:
      name: Personal
      color: "#81c8be"
    work:
      name: Work
      color: "#ca9ee6"
    errands:
      name: Errands
      color: "#ef9f76"
    health:
      name: Health
      color: "#babbf1"
    home:
      name: Home
      color: "#f2d5cf"
